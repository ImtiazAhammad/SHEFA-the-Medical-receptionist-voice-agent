[project]
name = "sefa-medical-voice-agent"
version = "0.1.0"
description = "HIPAA-compliant bilingual (EN/BN) voice AI medical receptionist - Sefa"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "twilio>=9.0.0",
    "openai>=1.60.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "numpy>=2.0.0",
    "websockets>=14.1",
    "cryptography>=44.0.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "sentry-sdk[fastapi]>=2.19.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.14.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "piper-tts",
]

[project.optional-dependencies]
bangla = [
    "indic-nlp-library>=0.8",
]
local-stt = [
    "faster-whisper>=1.1.0",
    "torch>=2.5.0",
]
local-tts = [
    "piper-tts>=1.4.0",
    "soundfile>=0.12.0",
]

[project.scripts]
sefa = "sefa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sefa"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
