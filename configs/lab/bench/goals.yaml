  language: bn
  phone: "01711010069"
  caller_type: ordinary
  goal: unknown_answer
  tags: [bench]
  max_turns: 6
  persona: >-
    আপনি লিপি, থাকেন ঢাকার বাইরে, ডাক্তার সুলতানা ভিডিও কলে বা অনলাইনে দেখেন কি না জানতে চান,
