    মেনে নেন আর জানতে চান কোথায় যোগাযোগ করবেন। কোনো সিরিয়াল এখন নেবেন না।
  expect:
    actions_none: [book_appointment]
    booked: 0
    reply_language: bn

# --- change: an appointment already exists --------------------------------------------------
- id: goals-change-cancel-cardiology-en
  title: English caller cancels the heart appointment
  tests: A clear cancel request is carried out on the right booking and confirmed.
  language: en
  phone: "01711010070"
  caller_type: ordinary
  goal: change
  tags: [bench, bakeoff]
  max_turns: 6
  setup:
    appointments:
      - {doctor: Rahman, date: "{iso:Sun}", time: "16:30", name: "Habib"}
  persona: >-
    You are Habib. You booked Dr. Rahman for {en:Sun} at half past four but now you are travelling
    out of the city, so you want to cancel it, not move it. You are calm, polite and brief. You
    confirm "yes, cancel it" when asked and say thank you at the end.
  expect:
    actions_any: [cancel_appointment]
    booked: 0
    reply_language: en

- id: goals-change-reschedule-children
  title: Mother moves the children's appointment to a later day
  tests: The booking moves to the new day without leaving the old slot taken.
  language: bn
  phone: "01711010071"
  caller_type: ordinary
  goal: change
  tags: [bench]
  max_turns: 8
  setup:
    appointments:
      - {doctor: Sultana, date: "{iso:Mon}", time: "10:00", name: "ইয়াসমিন"}
  persona: >-
