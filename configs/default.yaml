# Sefa Receptionist - Default Configuration
app:
  name: "Sefa Receptionist"
  version: "0.1.0"
  environment: "development"
  debug: true

languages:
  primary: "en"
  supported: ["en", "bn"]
  code_switching: true
  default_greeting:
    en: "Thank you for calling Sefa Clinic. How may I help you today?"
    bn: "মেডভয়েস ক্লিনিকে আপনাকে স্বাগতম। আমি আপনাকে কিভাবে সাহায্য করতে পারি?"

telephony:
  # Single provider knob (D-ENG13): twilio | asterisk | freeswitch.
  provider: "twilio"
  # SIP trunk credentials ONLY — provider selection lives at telephony.provider.
  # A `provider` key under `sip` is the removed two-key state and fails startup.
  sip:
    host: ""
    port: 5060
    username: ""
    password: ""
  twilio:
    account_sid: "${TWILIO_ACCOUNT_SID}"
    auth_token: "${TWILIO_AUTH_TOKEN}"
    phone_number: "${TWILIO_PHONE_NUMBER}"
    voice: "Polly.Matthew"
    max_call_duration: 1800  # 30 min
    # wss:// Media Stream endpoint (startup-validated). Empty = derive
    # wss://<account_sid>.twil.io/media-stream.
    media_stream_url: ""
  # Explicit outbound ingress URL (was: the deleted ngrok localhost scrape).
  # Must be an absolute http(s) URL when set.
  public_url: ""
  websocket:
    host: "0.0.0.0"
    port: 8765

pipeline:
  stt:
    provider: "whisper_local"  # openai | whisper_local | elevenlabs
    model: "whisper-1"
    language: "auto"
    temperature: 0.0
    enable_vad: true
    streaming: true
  tts:
    provider: "piper"  # elevenlabs | openai | piper | vits
    # Local Piper voice. Bangla is the pilot language and has no licensed
    # voice yet (T5 blocker): the pilot runs English-only until one exists.
    voice_path: "models/piper/en_US-lessac-medium.onnx"
    model: "eleven_multilingual_v2"  # elevenlabs only, unused by piper
    voice_id: "pNInz6obpgDQGcFmaJgB"  # Adam - professional male
    stability: 0.5
    similarity_boost: 0.75
    speed: 1.0
    sample_rate: 24000
  llm:
    provider: "qwen_local"  # openai | anthropic | qwen_local
    model: "qwen2.5:7b"
    temperature: 0.3
    max_tokens: 512
    system_prompt_file: "configs/prompts/system.md"
  language_detection:
    provider: "simple"  # simple | glotlid
    confidence_threshold: 0.6

session:
  backend: "memory"  # redis | memory
  ttl_seconds: 3600
  max_history_turns: 50

models:
  routing:
    strategy: "config"  # config | language_confidence | cost_optimized
    fallback_provider: "openai"
  adapters:
    stt_openai:
      type: "openai_stt"
      api_key: "${OPENAI_API_KEY}"
    stt_whisper_local:
      type: "whisper_local_stt"
      model_size: "large-v3"
      device: "cuda"
      compute_type: "float16"
      bangla_finetuned: true
    stt_elevenlabs:
      type: "elevenlabs_stt"
      api_key: "${ELEVENLABS_API_KEY}"
    tts_elevenlabs:
      type: "elevenlabs_tts"
      api_key: "${ELEVENLABS_API_KEY}"
    tts_piper:
      type: "piper_tts"
      model_path: "models/piper/bn_BD.nf_cycgan.onnx"
    tts_vits:
      type: "vits_tts"
      model_path: "models/vits/bangla_vits.pt"
    llm_openai:
      type: "openai_llm"
      api_key: "${OPENAI_API_KEY}"
      model: "gpt-4o"
    llm_anthropic:
      type: "anthropic_llm"
      api_key: "${ANTHROPIC_API_KEY}"
      model: "claude-3-5-sonnet-20241022"
    llm_qwen_local:
      type: "openai_compatible_llm"
      base_url: "http://localhost:8080/v1"
      model: "qwen3-8b"
      api_key: "not-needed"

integrations:
  calendar:
    provider: "google"  # google | epic | custom
    google:
      credentials_path: "configs/credentials/google_calendar.json"
      calendar_id: "primary"
  ehr:
    provider: "custom"  # epic | cerner | athenahealth | custom
    custom:
      base_url: "http://localhost:8081/api"
      api_key: "${EHR_API_KEY}"
  notifications:
    sms:
      provider: "twilio"
    email:
      provider: "smtp"
      smtp_host: "smtp.gmail.com"
      smtp_port: 587
      from_address: "appointments@Sefa.clinic"

compliance:
  hipaa_enabled: true
  encryption_algorithm: "AES-256-GCM"
  audit_log_enabled: true
  call_recording_consent_required: true
  data_retention_days: 2555  # 7 years
  phi_access_logging: true
  max_session_ttl: 3600

# T9: one SQLite file backs the calls table and the append-only audit log
# (WAL journal, monotonic seq). Tombstones, daily COUNT reconciliation, and
# the D5 zero-log alert all read this store.
storage:
  db_path: "data/sefa.db"

monitoring:
  prometheus:
    enabled: true
    port: 9090
  sentry:
    enabled: false
    dsn: "${SENTRY_DSN}"
  logging:
    level: "INFO"
    format: "json"
    phi_masking: true

escalation:
  # E.164 numbers a transfer can actually dial. Empty means no human is
  # reachable: the agent must not promise a patient a transfer it cannot make.
  # The staffed on-call allow-list for the unmanned window is an open blocker.
  on_call_numbers: []
  hold_audio_url: ""
  # Gates the "sorry, could you repeat?" prompt. Low confidence means the
  # agent may have misheard; it does not put the patient on hold for a human.
  # Escalation is content-driven only (emergency keywords).
  repeat_threshold: 0.5
  max_transfer_attempts: 3
  # D-ENG17: emergency_keywords are additive-only — a hit may only ADD the
  # transfer path, never hang up. The four words that embed benignly
  # ("emergency", "unconscious", "জরুরি", "অজ্ঞান") fire only as the whole
  # utterance or its final word ("জরুরি প্রয়োজনে", "emergency contact"
  # stay benign); every other entry is boundary-anchored and matches
  # anywhere. Adding a generic word like "urgent" without also classifying
  # it breaks the benign-urgent corpus in tests/unit/test_emergency_corpus.py.
  # NOTE: the phrase set is provisionally extended pending named-owner
  # (clinician) review before the Child 6 demo.
  emergency_keywords:
    en: ["chest pain", "can't breathe", "cant breathe", "severe bleeding",
         "heart attack", "not breathing", "isn't breathing", "is not breathing",
         "passed out", "fainted", "lost consciousness", "is unconscious",
         "unresponsive", "having a seizure", "having a fit", "severe pain",
         "can't move", "cant move", "i'm dying", "im dying",
         "is having a stroke", "had a stroke", "emergency", "unconscious"]
    bn: ["জরুরি", "অজ্ঞান", "বুকে ব্যথা", "তীব্র রক্তক্ষরণ",
         "শ্বাস নিতে পারছি না", "অজ্ঞান হয়ে গেছি", "অজ্ঞান হয়ে গিয়েছে",
         "জ্ঞান হারিয়ে ফেলেছি", "খিচুনি আসছে", "পুড়ে গেছি",
         "একটা দুর্ঘটনা হয়েছে"]
  transfer_greeting:
    en: "I'm transferring you to our receptionist now. Please hold."
    bn: "আমি আপনাকে আমাদের রিসেপশনিস্টের কাছে স্থানান্তর করছি। অনুগ্রহ করে অপেক্ষা করুন।"
  repeat_prompt:
    en: "Sorry, I didn't catch that clearly. Could you say that again?"
    bn: "দুঃখিত, আমি স্পষ্টভাবে বুঝতে পারলাম না। আবার বলবেন?"
  # Spoken when the Nth consecutive turn failure ends the call: courtesy plus
  # a DTMF/transfer offer the patient can act on, so failure is never dead air
  # or a hangup on its own. max_transfer_attempts gates how many retries run
  # before this prompt is played.
  terminal_prompt:
    en: "I'm having trouble hearing you, so I'll connect you to our front desk. Please hold, or press star at any time."
    bn: "আমি আপনাকে পরিষ্কার করে শুনতে সমস্যা হচ্ছে, তাই আমি আপনাকে আমাদের সামনের ডেস্কে সংযোগ করছি। অনুগ্রহ করে অপেক্ষা করুন, অথবা যেকোনো সময় স্টার চাপুন।"
  # Spoken once when a caller's language is neither en nor bn (D-ENG16): an
  # explicit OTHER route hands the call to a human with a warm transfer/DTMF
  # offer instead of replying in a language the caller does not speak.
  other_language_prompt:
    en: "I'll connect you to our front desk now. Please hold, or press star for a callback."
    bn: "আমি আপনাকে এখন সামনের ডেস্কে সংযোগ করছি। আপনার সুবিধা হলে অপেক্ষা করুন, অথবা স্টার চাপুন।"

# T7: authentication and authorization for every route. Nothing here is a
# working secret — `principals[].token_hash` is a PBKDF2 record, and the
# plaintext token is shown once by `sefa token mint`. With no principal
# configured the API refuses every request rather than serving unauthenticated.
auth:
  dev_mode: false            # must be actively set true; gates the Twilio router
  bind_host: "127.0.0.1"      # loopback by default, not 0.0.0.0
  roles:
    viewer:
      - "sessions:read"
    clinician:
      - "sessions:read"
      - "calls:place"
      - "chat:use"
    admin:
      - "sessions:read"
      - "calls:place"
      - "chat:use"
      - "config:read"
  principals: []             # e.g. [{name: front-desk, role: clinician, token_hash: "pbkdf2_sha256$..."}]
