<!doctype html>
<html lang="bn" data-title-key="si_page_title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>স্টাফ সাইন-ইন</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script type="module" src="js/signin.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand" data-i18n="app_name">SHEFA ভয়েস কমন্স</span>
    <button type="button" class="small-btn" id="lang"></button>
  </header>
  <main class="page narrow">
    <form class="card signin-card stack" id="form" autocomplete="off" novalidate>
      <h1 data-i18n="si_title">স্টাফ সাইন-ইন</h1>
      <p data-i18n="si_intro">আপনাকে দেওয়া টোকেনটি লিখুন। টোকেন শুধু এই ট্যাবে থাকে, ট্যাব বন্ধ করলে মুছে যায়।</p>
      <p id="flash" class="banner warn" role="alert" hidden></p>
      <div class="field">
        <label for="token" data-i18n="si_token">টোকেন</label>
        <input type="password" id="token" name="staff-token" autocomplete="off" autocapitalize="off" spellcheck="false" required aria-describedby="token-msg">
        <label class="flagbox small" for="show"><input type="checkbox" id="show"><span data-i18n="si_show">টোকেন দেখাও</span></label>
      </div>
      <p id="token-msg" class="banner error" role="alert" hidden></p>
      <button type="submit" class="primary big" id="go" data-i18n="si_go">ঢুকি</button>
    </form>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
