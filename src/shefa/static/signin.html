<!doctype html><html lang="en"><head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230b5d44%27/%3E%3Cg transform=%27rotate(-38 16 16)%27%3E%3Crect x=%276%27 y=%2711.5%27 width=%2720%27 height=%279%27 rx=%274.5%27 fill=%27%23fff%27/%3E%3Cpath d=%27M16 11.5h5.5a4.5 4.5 0 0 1 0 9H16z%27 fill=%27%232d5bc8%27/%3E%3C/g%3E%3C/svg%3E"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHEFA sign in</title>
<link rel="stylesheet" href="/static/world/fonts.css"><link rel="stylesheet" href="/static/world/world.css">
<style>:root{--bg:var(--shelf);--fg:var(--ink);--card:var(--box);--line:var(--ink);--accent:var(--primary)}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font)}
form{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:28px;width:min(92vw,380px)}
h1{margin:0 0 4px;font-size:2rem;font-stretch:78%;font-weight:650;line-height:1.05}p{margin:0 0 18px;opacity:.7}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:var(--r-sm);font:inherit}
input{border:1px solid var(--line);background:transparent;color:inherit;margin-bottom:12px}button{border:0;background:var(--accent);color:var(--on-primary);font-weight:600;cursor:pointer}
#err{color:var(--ink);font-weight:600;min-height:1.4em;margin-top:10px;font-size:14px}
/* Bangla has no case, and tracking breaks its conjuncts. */
:lang(bn){letter-spacing:0!important}
</style></head><body>
<form id="f"><h1>SHEFA</h1><p>Clinic console. Paste your access token.</p>
<input type="text" name="username" autocomplete="username" value="shefa" hidden>
<input id="t" type="password" placeholder="Access token" autocomplete="current-password" required autofocus>
<button>Sign in</button><div id="err"></div></form>
<script>f.onsubmit=async e=>{e.preventDefault();err.textContent='';
const r=await fetch('/api/v1/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t.value.trim()})});
if(r.ok)location.reload();else err.textContent='That token was not accepted.'}</script></body></html>
