<!doctype html><html lang="en"><head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 28 28%27%3E%3Crect width=%2728%27 height=%2728%27 fill=%27%23f9fafb%27/%3E%3Crect x=%270.5%27 y=%270.5%27 width=%2727%27 height=%2727%27 fill=%27none%27 stroke=%27%2317191c%27/%3E%3Crect x=%274%27 y=%274%27 width=%275%27 height=%2720%27 fill=%27%2317191c%27/%3E%3Crect x=%2711.5%27 y=%274%27 width=%275%27 height=%2720%27 fill=%27%23808388%27/%3E%3Crect x=%2719%27 y=%274%27 width=%275%27 height=%2720%27 fill=%27%23c4127a%27/%3E%3C/svg%3E"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHEFA sign in</title>
<link rel="stylesheet" href="/static/world/fonts.css"><link rel="stylesheet" href="/static/world/world.css">
<style>:root{--bg:var(--ground);--fg:var(--ink);--card:var(--sheet);--line:var(--ink);--accent:var(--select)}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font)}
form{background:var(--card);border:1px solid var(--line);border-radius:0;padding:28px;width:min(92vw,380px)}
h1{margin:0 0 4px;font-size:2rem;font-stretch:78%;font-weight:650;line-height:1.05}p{margin:0 0 18px;opacity:.7}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:0;font:inherit}
input{border:1px solid var(--line);background:transparent;color:inherit;margin-bottom:12px}button{border:0;background:var(--accent);color:var(--on-select);font-weight:600;cursor:pointer}
#err{color:var(--ink);font-weight:600;min-height:1.4em;margin-top:10px;font-size:14px}
/* Bangla has no case, and tracking breaks its conjuncts. */
:lang(bn){letter-spacing:0!important}
</style></head><body>
<form id="f"><h1>SHEFA</h1><p>Clinic console. Paste your access token.</p>
<input type="text" name="username" autocomplete="username" value="shefa" hidden>
<input id="t" type="password" placeholder="Access token" autocomplete="current-password" required autofocus>
<button>Sign in</button><div id="err"></div></form>
<script>f.onsubmit=async e=>{e.preventDefault();err.textContent='';
const r=await fetch('/api/v1/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t.value.trim()})});
if(r.ok)location.reload();else err.textContent='That token was not accepted.'}</script></body></html>
